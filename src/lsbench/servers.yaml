# Servers under test and distractors.
#
# FAIRNESS RULES (see CLAUDE.md) — this is published work about other people's code:
#   - pin an exact version, never "latest"
#   - record the date tested
#   - file issues with reproductions BEFORE publishing scores
#   - give maintainers a chance to respond, and record their response here
#
# `roles` maps the benchmark's abstract tool roles to each server's real tool
# names. Routing tasks say "expect_first_role: series_lookup"; this file says
# what that means for each server. The mapping is public — dispute it in `notes`.
#
# `source` is the provmcp release resolver, so every recorded call carries the
# upstream data release at the time of the run.

servers:
  - id: geomcp
    name: MCPmed/GEOmcp
    domain: gene-expression
    command: ["uvx", "--python", "3.12", "--with", "mcp<2", "geo-mcp==0.1.2", "--max-file-size-mb", "500", "--max-total-downloads-mb", "1000"]
    env: {GEOMCP_EMAIL: "${GEOMCP_EMAIL}"}   # NCBI E-utilities contact address; export it before running
    repo: https://github.com/MCPmed/GEOmcp
    version_tested: "0.1.2"
    date_tested: "2026-09-20"
    maintainer_notified: false
    source: geo
    roles:
      series_lookup: [search_geo_series, search_geo]      # no by-accession tool; accession search is the closest
      series_search: [search_geo_series, search_geo_datasets, search_geo]
      sample_lookup: [search_geo_samples]
    notes: >
      Thin wrapper; one tool per GEO database. Crashes on the 2.x Python SDK
      ('Server' object has no attribute 'list_tools'), hence the mcp<2 pin;
      speaks the 2025-11-25 handshake. Without GEOMCP_EMAIL every search
      returns {"esummaryresult": ["Empty id list - nothing todo"]} as a
      success — the configuration error is swallowed (geo_profiles.py catches
      the exception and returns the empty shape). The benchmark sets the
      email so that this is not what gets scored; it is still a finding.
      download_geo_data refuses to run unless free disk >= 2 x max_file_size_mb
      (10 GB at the 5000 MB default) and reports "insufficient disk space to
      continue". The 2026-09-20 series ran on a machine with 4.7 GB free, so
      every download attempt in it failed for environmental reasons — see
      docs/results-2026-09-20.md. --max-file-size-mb 500 (a documented server
      option) was added after that series; the next series will carry it. No lookup-by-accession tool exists, so
      series_lookup maps to the series search called with an accession term.
      Expect low routing scores if the thesis is right. If it scores well, the
      thesis is wrong — say so.

  - id: otp-official
    name: Open Targets Platform MCP (official)
    domain: target-disease
    command: ["uvx", "--python", "3.12", "--from", "git+https://github.com/opentargets/open-targets-platform-mcp@2026.7.1", "otp-mcp", "--transport", "stdio"]
    repo: https://github.com/opentargets/open-targets-platform-mcp
    version_tested: "2026.7.1 (742f7ef)"
    date_tested: "2026-09-20"
    maintainer_notified: false
    source: opentargets
    roles:
      target_lookup: [search_entities, query_open_targets_graphql, get_open_targets_graphql_schema]
      target_drugs: [search_entities, query_open_targets_graphql, get_open_targets_graphql_schema, get_type_dependencies]
    notes: >
      Official, built with Anthropic. Five tools: schema discovery, type
      dependencies, entity search, GraphQL query, batch query. The model is
      expected to fetch a schema subset before writing GraphQL, so any of the
      discovery tools is an acceptable first call. Positive control for the
      "designed vs generated" thesis.

  - id: otp-community
    name: nickzren/opentargets-mcp
    domain: target-disease
    command: ["uvx", "--python", "3.12", "opentargets-mcp==0.5.0"]
    repo: https://github.com/nickzren/opentargets-mcp
    version_tested: "0.5.0"
    date_tested: "2026-09-20"
    maintainer_notified: false
    source: opentargets
    roles:
      target_lookup: [search_entities, map_ids, get_target_info]
      target_drugs: [get_target_known_drugs, search_entities, map_ids]
    notes: >
      68 tools, one per Platform endpoint, over the same GraphQL API as the
      official server. The direct comparison. get_target_known_drugs is named
      for a field the 26.06 schema removed (knownDrugs -> drugAndClinicalCandidates);
      whether it still works is exactly what the recovery tasks probe.

# Distractor servers loaded alongside the server under test, to make tool
# discovery non-trivial. Tool discovery under distraction is the primary
# failure mode prior work identifies. A distractor is never scored.
distractors:
  - id: clinicaltrials
    name: agents100x/clinicaltrials-mcp
    domain: clinical-trials
    command: ["uvx", "--python", "3.12", "--with", "mcp<2", "clinicaltrials-mcp==0.1.1"]
    repo: https://github.com/agents100x/clinicaltrials-mcp
    version_tested: "0.1.1"
    date_tested: "2026-09-20"
    source: clinicaltrials
    notes: "5 tools. Needs the 1.x SDK pin."

  - id: pubmed
    name: pubmedmcp
    domain: literature
    command: ["uvx", "--python", "3.12", "--with", "mcp<2", "pubmedmcp==0.1.4"]
    version_tested: "0.1.4"
    date_tested: "2026-09-20"
    source: eutils
    source_options: {db: pubmed}
    notes: "1 tool (search_abstracts). Needs the 1.x SDK pin."
