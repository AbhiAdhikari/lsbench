name: ci

on:
  push:
    branches: [main]
  pull_request:

# Offline only: the scripted-model suite exercises harness, proxy, scoring and
# report with canned decisions. Live series cost money and are run by hand;
# see README "Usage".
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv venv && uv pip install -e ".[dev]"
      - run: uv run ruff check .
      - run: uv run pytest -q
      - run: uv run lsbench validate
